<!-- ================= FLOATING AI FINANCIAL BOT (A3 CHOICE) ================= -->
  <div id="ai-chat-bubble" class="fixed bottom-6 right-6 z-50">
    <button onclick="toggleAiChat()" title="Tanya Asisten AI Keuangan" class="relative w-12 h-12 rounded-2xl bg-white border border-brandTeal/30 shadow-lg hover:shadow-xl hover:scale-105 active:scale-95 transition-all text-brandTeal flex items-center justify-center">
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="10" rx="4"/>
        <circle cx="12" cy="5" r="2"/>
        <path d="M12 7v4"/>
        <line x1="8" y1="16" x2="8.01" y2="16"/>
        <line x1="16" y1="16" x2="16.01" y2="16"/>
        <path d="M9 19h6"/>
      </svg>
      <span class="absolute -top-1 -right-1 w-3 h-3 bg-brandCoral border-2 border-white rounded-full"></span>
    </button>

    <!-- Floating Chat Window -->
    <div id="ai-chat-window" class="hidden absolute bottom-16 right-0 w-[350px] max-w-[90vw] h-[480px] bg-white/95 backdrop-blur-2xl rounded-3xl border border-slate-200 shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
      <div class="px-4 py-3 bg-brandTealLight border-b border-brandTeal/20 flex items-center justify-between">
        <div class="flex items-center gap-2 text-brandTealDark">
          <svg class="w-5 h-5 text-brandTeal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="4"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/></svg>
          <span class="text-xs font-bold">Asisten</span>
        </div>
        <button onclick="toggleAiChat()" class="text-slate-400 hover:text-slate-600 text-lg font-bold leading-none">&times;</button>
      </div>

      <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 text-xs">
        <div class="flex items-start gap-2">
          <div class="w-7 h-7 rounded-xl bg-brandTealLight text-brandTeal flex items-center justify-center text-xs shrink-0 font-bold">AI</div>
          <div class="bg-slate-100 rounded-2xl rounded-tl-sm p-3 text-slate-700 leading-relaxed shadow-sm">
            Halo! Saya asisten pintar transaksi Anda. Ada yang ingin Anda tanyakan seputar total pemasukan atau riwayat transaksi?
          </div>
        </div>
      </div>

      <!-- Quick Prompt Pills -->
      <div class="px-3 py-1.5 bg-slate-50 border-t border-slate-100 flex gap-1.5 overflow-x-auto text-[11px] no-scrollbar">
        <button type="button" onclick="sendQuickChat('Berapa total pemasukan saat ini?')" class="px-2.5 py-1 rounded-full bg-white border border-slate-200 hover:border-brandTeal hover:text-brandTeal shrink-0 font-medium shadow-2xs transition-colors">Total pemasukan?</button>
        <button type="button" onclick="sendQuickChat('Siapa klien yang paling sering order?')" class="px-2.5 py-1 rounded-full bg-white border border-slate-200 hover:border-brandTeal hover:text-brandTeal shrink-0 font-medium shadow-2xs transition-colors">Klien teratas?</button>
        <button type="button" onclick="sendQuickChat('Ada invoice yang belum lunas?')" class="px-2.5 py-1 rounded-full bg-white border border-slate-200 hover:border-brandTeal hover:text-brandTeal shrink-0 font-medium shadow-2xs transition-colors">Status tagihan?</button>
      </div>

      <div class="p-3 bg-white border-t border-slate-100 flex items-center gap-2">
        <input type="text" id="chat-input" onkeydown="if(event.key==='Enter') sendChatMessage()" placeholder="Tanya AI tentang keuangan..." class="flex-1 px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-full focus:outline-none focus:ring-2 focus:ring-brandTeal">
        <button onclick="sendChatMessage()" class="w-8 h-8 rounded-full bg-brandTeal hover:bg-brandTealDark text-white flex items-center justify-center shadow-sm">
          <i data-lucide="send" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>
  </div>
