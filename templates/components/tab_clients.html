<!-- ======================================================= -->
      <!-- TAB 3: KAMUS KLIEN & INISIAL                             -->
      <!-- ======================================================= -->
      <div id="tab-view-clients" class="tab-view">
        <div class="bg-white border border-slate-200/90 rounded-2xl p-6 shadow-sm max-w-4xl mx-auto space-y-4">
          <div class="flex items-center justify-between pb-3 border-b border-slate-100">
            <div>
              <h2 class="text-base font-bold text-brandDark">Kamus Alias &amp; Inisial Klien</h2>
              <p class="text-xs text-slate-400">Otomatis mengubah inisial pendek di invoice menjadi nama lengkap klien resmi.</p>
            </div>
            <button onclick="addNewClientRow()" class="px-3.5 py-1.5 bg-brandTealLight text-brandTealDark hover:bg-brandTeal hover:text-white text-xs font-bold rounded-xl flex items-center gap-1.5 transition-colors">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah Inisial Baru
            </button>
          </div>

          <div class="overflow-hidden border border-slate-200 rounded-xl">
            <table class="w-full text-left text-xs" id="clients-table">
              <thead class="bg-slate-50 text-slate-500 uppercase border-b border-slate-200">
                <tr>
                  <th class="px-4 py-3 font-semibold w-1/3">Inisial / Singkatan</th>
                  <th class="px-4 py-3 font-semibold">Nama Lengkap Klien</th>
                  <th class="px-4 py-3 font-semibold w-20 text-center">Aksi</th>
                </tr>
              </thead>
              <tbody id="clients-tbody" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>

          <div class="flex justify-end pt-2">
            <button onclick="saveClientsDictionary()" class="px-5 py-2.5 rounded-xl bg-brandCoral hover:bg-brandCoralDark text-white font-semibold text-xs shadow-md shadow-brandCoral/20 flex items-center gap-2">
              <i data-lucide="save" class="w-3.5 h-3.5"></i> Simpan Perubahan Kamus
            </button>
          </div>
        </div>
      </div>
