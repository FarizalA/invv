<header class="top-bar">
        <!-- Mobile Logo & Brand (Only visible on mobile) -->
        <div class="flex items-center gap-2 md:hidden cursor-pointer shrink-0" onclick="switchNavTab('dashboard')">
          <div class="brand-logo-dots scale-90">
            <span class="dot-coral"></span>
            <span class="dot-teal"></span>
          </div>
          <div class="flex flex-col">
            <span class="font-bold text-sm text-brandDark tracking-tight leading-none">Invoice</span>
            <span class="text-[9px] text-slate-400 font-medium leading-none mt-0.5">Smart Sheets</span>
          </div>
        </div>

        <!-- Search Input -->
        <div class="search-box">
          <input type="text" id="global-search-input" placeholder="Cari invoice, klien, atau kategori..." oninput="handleGlobalSearch(this.value)" />
          <svg class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="20" y1="20" x2="16.2" y2="16.2"></line>
          </svg>
        </div>

        <div class="flex items-center gap-1.5 sm:gap-3 shrink-0">
          <!-- Tombol Asisten AI (Mobile) -->
          <button onclick="toggleAiChat()" title="Tanya Asisten AI" class="md:hidden w-9 h-9 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-brandTeal shadow-xs transition-all flex items-center justify-center relative shrink-0">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="10" rx="4"/>
              <circle cx="12" cy="5" r="2"/>
              <path d="M12 7v4"/>
            </svg>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-brandCoral rounded-full ring-2 ring-white"></span>
          </button>

          <!-- Tombol Segarkan Realtime -->
          <button onclick="loadMonitorRecords(true)" title="Segarkan Data Google Sheets" class="w-9 h-9 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 shadow-xs transition-all flex items-center justify-center shrink-0">
            <i data-lucide="refresh-cw" id="top-refresh-icon" class="w-4 h-4"></i>
          </button>

          <!-- Top Right Status System Pill -->
          <div class="status-system-pill cursor-pointer shrink-0" onclick="switchNavTab('settings')">
            <div class="status-icon-circle">
              <svg class="w-4 h-4 sm:w-5 sm:h-5 text-brandCoral" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              </svg>
            </div>
            <div class="flex flex-col text-left">
              <div class="flex items-center gap-1.5">
                <span id="top-ai-provider-badge" class="font-bold text-[11px] sm:text-xs text-brandDark uppercase tracking-tight">Gemini AI</span>
                <span id="top-ai-status-dot" class="w-2 h-2 rounded-full bg-slate-300" title="Status Koneksi AI"></span>
              </div>
              <span id="top-sync-status-text" class="text-[10px] text-slate-400 font-medium hidden sm:block">Sheets: Realtime Active</span>
            </div>
          </div>
        </div>
      </header>
