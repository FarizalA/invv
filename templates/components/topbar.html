<header class="top-bar">
        <!-- Search Input -->
        <div class="search-box">
          <input type="text" id="global-search-input" placeholder="Cari invoice, klien, atau kategori..." oninput="handleGlobalSearch(this.value)" />
          <svg class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="20" y1="20" x2="16.2" y2="16.2"></line>
          </svg>
        </div>

        <div class="flex items-center gap-3">
          <!-- Tombol Segarkan Realtime -->
          <button onclick="loadMonitorRecords(true)" title="Segarkan Data Google Sheets" class="p-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600 transition-all flex items-center justify-center">
            <i data-lucide="refresh-cw" id="top-refresh-icon" class="w-4 h-4"></i>
          </button>

          <!-- Top Right Status System Pill: Ganti Profil Login Madhu (A1) -->
          <div class="status-system-pill" onclick="switchNavTab('settings')">
            <div class="status-icon-circle">
              <svg class="w-5 h-5 text-brandCoral" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              </svg>
            </div>
            <div class="flex flex-col text-left">
              <div class="flex items-center gap-1.5">
                <span id="top-ai-provider-badge" class="font-bold text-xs text-brandDark uppercase">Gemini AI</span>
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" title="Google Sheets Online"></span>
              </div>
              <span id="top-sync-status-text" class="text-[10px] text-slate-400 font-medium">Sheets: Realtime Active</span>
            </div>
          </div>
        </div>
      </header>
