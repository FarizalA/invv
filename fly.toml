# fly.toml app configuration file generated for invv on 2026-11-04T02:24:17Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'invv'
primary_region = 'ams'

[build]

[processes]
  app = "/app/.venv/bin/flask run --host=0.0.0.0 --port=8080"
  bot = "/app/.venv/bin/python telegram_bot.py"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
